repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-added-large-files
        args: ['--maxkb=2000']
      - id: check-merge-conflict

  - repo: https://github.com/psf/black
    rev: 23.12.1
    hooks:
      - id: black
        language_version: python3
        args: ['--line-length=120']

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        args: ['--max-line-length=120', '--ignore=E501,W503']

  - repo: local
    hooks:
      - id: check-ui-kit
        name: Check ui_kit.py has required functions
        entry: bash -c 'grep -q "def brand_row" core/ui_kit.py && grep -q "def field" core/ui_kit.py && grep -q "def centered_card" core/ui_kit.py && grep -q "class AdaptiveButton" core/ui_kit.py'
        language: system
        files: ^core/ui_kit\.py$
        pass_filenames: false

      - id: python-syntax
        name: Check Python syntax
        entry: python3 -m py_compile
        language: system
        types: [python]
