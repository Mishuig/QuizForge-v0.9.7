name: Portable Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    name: Build ${{ matrix.app }}
    needs: test
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: Client
            entry: client/main.py
            icon: assets/logo-client.ico
          - app: Admin
            entry: admin/main.py
            icon: assets/logo-admin.ico
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
      - name: Build ${{ matrix.app }}
        shell: bash
        run: |
          if [ "${{ matrix.app }}" = "Admin" ] && [ -f "admin.spec" ]; then
            echo "Building Admin with spec file"
            pyinstaller --noconfirm --clean admin.spec
          else
            pyinstaller --noconfirm --clean --onefile --windowed \
              --name "QuizForge-${{ matrix.app }}" \
              --icon "${{ matrix.icon }}" \
              --paths . \
              --add-data "assets;assets" \
              --add-data "client/ui;client/ui" \
              --add-data "fonts;fonts" \
              --hidden-import PyQt6.QtSvg \
              --collect-submodules admin \
              --collect-submodules core \
              "${{ matrix.entry }}"
          fi
          ls -lh dist/
      - uses: actions/upload-artifact@v4
        with:
          name: exe-${{ matrix.app }}
          path: dist/QuizForge-${{ matrix.app }}.exe
          retention-days: 7

  package:
    name: Package portable
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: ver
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "version=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "version=dev-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/download-artifact@v4
        with:
          pattern: exe-*
          merge-multiple: true
          path: dl
      - name: Assemble portable
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          NAME="QuizForge-Portable-Windows-${VERSION}"
          mkdir -p "$NAME"
          cp dl/*.exe "$NAME/"
          cp config.json.example "$NAME/config.json" 2>/dev/null || true
          zip -r "${NAME}.zip" "$NAME"
          echo "ZIP=${NAME}.zip" >> "$GITHUB_ENV"
      - uses: actions/upload-artifact@v4
        with:
          name: QuizForge-Portable-${{ steps.ver.outputs.version }}
          path: ${{ env.ZIP }}
          retention-days: 30
      - name: Create Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP }}
          generate_release_notes: true
