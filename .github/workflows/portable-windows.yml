name: Portable Windows

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: portable-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglib2.0-0 libxkbcommon0 libdbus-1-3
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Run tests
        run: python -m pytest tests/ -q --tb=short
        env:
          QT_QPA_PLATFORM: offscreen

  build:
    name: Build portable
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Admin
        shell: bash
        run: |
          if [ -f "admin.spec" ]; then
            pyinstaller --noconfirm --clean admin.spec
          else
            pyinstaller --noconfirm --clean --onefile --windowed \
              --name "QuizForge-Admin" \
              --icon "assets/logo-admin.ico" \
              --paths . \
              --add-data "assets;assets" \
              --add-data "admin;admin" \
              --add-data "core;core" \
              --add-data "client/ui;client/ui" \
              --add-data "fonts;fonts" \
              --hidden-import admin.students_tab \
              --hidden-import admin.tests_tab \
              --hidden-import admin.results_tab \
              --collect-submodules admin \
              --collect-submodules core \
              admin/main.py
          fi

      - name: Build Client
        shell: bash
        run: |
          pyinstaller --noconfirm --clean --onefile --windowed \
            --name "QuizForge-Client" \
            --icon "assets/logo-client.ico" \
            --paths . \
            --add-data "assets;assets" \
            --add-data "core;core" \
            --add-data "client/ui;client/ui" \
            --add-data "fonts;fonts" \
            --collect-submodules core \
            client/main.py

      - name: Package portable
        shell: bash
        run: |
          VERSION="${GITHUB_SHA::7}"
          NAME="QuizForge-Portable-Windows-${VERSION}"
          mkdir -p "$NAME"
          cp dist/QuizForge-Admin.exe dist/QuizForge-Client.exe "$NAME/"
          cp config.json.example "$NAME/config.json" 2>/dev/null || true
          cp README.md FIRST_RUN.md LICENSE "$NAME/" 2>/dev/null || true
          cp -r assets fonts "$NAME/" 2>/dev/null || true
          echo "$VERSION" > "$NAME/VERSION"
          7z a "${NAME}.zip" "$NAME"
          echo "ZIP=${NAME}.zip" >> "$GITHUB_ENV"

      - name: Upload portable
        uses: actions/upload-artifact@v4
        with:
          name: QuizForge-Portable
          path: QuizForge-Portable-*.zip
          retention-days: 30
